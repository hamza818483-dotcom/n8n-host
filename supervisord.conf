[supervisord]
nodaemon=true
user=root

[program:n8n]
command=node /usr/local/lib/node_modules/n8n/bin/n8n start
user=node
environment=HOME="/home/node",N8N_PORT="7861"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bridge]
command=node /bridge/server.js
directory=/bridge
user=node
environment=PORT="7862",N8N_BASE_URL="http://127.0.0.1:7861"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
